name: Keep Streamlit awake

on:
  schedule:
    - cron: "17 */10 * * *"   # ping the Streamlit app
    - cron: "43 4 * * 1"      # weekly: keep the workflow from being auto-disabled
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl --fail --location --retry 3 --retry-delay 10 --max-time 90 \
            --cookie-jar "$RUNNER_TEMP/streamlit-cookies.txt" \
            --cookie "$RUNNER_TEMP/streamlit-cookies.txt" \
            --user-agent "GitHub-Actions-Streamlit-Keepalive" \
            "https://flu-vaccination-prediction.streamlit.app/"

  # GitHub disables scheduled workflows after 60 days without repository
  # activity. Re-enabling the workflow through the API resets that timer,
  # without adding commits to the history.
  keep-workflow-enabled:
    if: github.event_name != 'schedule' || github.event.schedule == '43 4 * * 1'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            "repos/${{ github.repository }}/actions/workflows/keep-streamlit-awake.yml/enable"
