name: Keep Streamlit awake

on:
  schedule:
    - cron: "17 */10 * * *"   # ping the Streamlit app
    - cron: "43 4 * * 1"      # weekly: keep the workflow from being auto-disabled
    - cron: "29 5 1 * *"      # monthly: keepalive commit if the repo is idle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl --fail --location --retry 3 --retry-delay 10 --max-time 90 \
            --cookie-jar "$RUNNER_TEMP/streamlit-cookies.txt" \
            --cookie "$RUNNER_TEMP/streamlit-cookies.txt" \
            --user-agent "GitHub-Actions-Streamlit-Keepalive" \
            "https://flu-vaccination-prediction.streamlit.app/"

  # GitHub disables scheduled workflows after 60 days without repository
  # activity. Re-enabling the workflow through the API resets that timer,
  # without adding commits to the history.
  keep-workflow-enabled:
    if: github.event_name != 'schedule' || github.event.schedule == '43 4 * * 1'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            "repos/${{ github.repository }}/actions/workflows/keep-streamlit-awake.yml/enable"

  # Fallback guaranteed by GitHub's rules: a push counts as repository
  # activity. Commits only when main has had no commit for 30+ days,
  # so it adds at most one small commit per month.
  keepalive-commit:
    if: github.event_name != 'schedule' || github.event.schedule == '29 5 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Commit keepalive timestamp if repository is idle
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ($(date +%s) - last) / 86400 ))
          echo "Last commit: ${age_days} day(s) ago"
          if [ "$age_days" -lt 30 ]; then
            echo "Repository is active, no keepalive commit needed."
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive (prevent scheduled workflow auto-disable)"
          git push
